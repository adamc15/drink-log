<style>
:root{
  --paper:#EDF1F2; --card:#FFFFFF; --ink:#17262E; --ink-2:#55707C; --ink-3:#88A0AA;
  --line:#D8E1E4; --amber:#C4863A; --amber-soft:#F0E0CB; --teal:#1F5F63; --rust:#9E4A3C; --sage:#5F8A6B;
  --r:14px; --shadow:0 1px 2px rgba(23,38,46,.06), 0 8px 24px -16px rgba(23,38,46,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
.num{font-family:ui-serif,Georgia,"Times New Roman",serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:540px;margin:0 auto;padding:0 18px calc(168px + env(safe-area-inset-bottom))}
header{padding:calc(14px + env(safe-area-inset-top)) 0 6px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:15px;font-weight:600;letter-spacing:.01em;color:var(--ink-2)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink-2);width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;cursor:pointer}
.iconbtn:active{background:var(--paper)}
.tabs{display:flex;gap:4px;background:#E1E8EA;padding:4px;border-radius:12px;margin:14px 0 18px}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:14px;font-weight:550;padding:8px 4px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(23,38,46,.10)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.lede{font-size:19px;line-height:1.35;margin:0 0 4px;letter-spacing:-.01em}
.lede b{font-family:ui-serif,Georgia,serif;font-weight:600;font-size:25px;letter-spacing:-.02em}
.sub{color:var(--ink-2);font-size:14px;margin:0}
.sub .up{color:var(--rust)} .sub .down{color:var(--sage)}
/* week strip */
.strip{display:flex;align-items:flex-end;gap:8px;height:132px;margin:20px 0 6px;position:relative}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;background:none;border:0;padding:0;cursor:pointer;position:relative}
.bar{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--amber);min-height:4px;transition:height .25s ease}
.bar.over{background:var(--rust)}
.bar.zero{background:none;height:0!important}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sage);opacity:.75;margin-bottom:1px}
.dot.future{background:var(--line);opacity:1}
.val{font-size:11px;color:var(--ink-2);margin-bottom:5px;font-variant-numeric:tabular-nums;min-height:14px}
.axis{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:7px}
.axis span{flex:1;text-align:center;font-size:12px;color:var(--ink-3)}
.axis span.today{color:var(--ink);font-weight:650}
.limitline{position:absolute;left:0;right:0;border-top:1px dashed var(--ink-3);opacity:.65}
.limitline i{position:absolute;right:0;top:-16px;font-style:normal;font-size:10px;color:var(--ink-3);background:var(--card);padding:0 4px}
.col:focus-visible,.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
/* lists */
h2{font-size:13px;font-weight:650;color:var(--ink-2);margin:22px 0 9px;letter-spacing:.02em}
.day{margin-bottom:16px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-2);padding:0 2px 7px}
.dayhead b{color:var(--ink);font-weight:600;font-size:14px}
.entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:7px;font:inherit;cursor:pointer}
.entry:active{background:#F7FAFB}
.entry .time{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;width:62px;flex:none}
.entry .name{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .name small{display:block;color:var(--ink-3);font-size:12px;white-space:normal}
.entry .sd{font-family:ui-serif,Georgia,serif;font-size:15px;color:var(--amber);font-variant-numeric:tabular-nums}
.entry .sd.other{color:var(--ink-3);font-family:inherit;font-size:13px}
.empty{text-align:center;color:var(--ink-2);font-size:14px;padding:26px 16px;border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:600}
/* hourly */
.hours{display:flex;align-items:flex-end;gap:2px;height:76px;margin:4px 0 6px}
.hr{flex:1;background:var(--amber-soft);border-radius:3px;min-height:3px}
.hr.on{background:var(--amber)}
.hourax{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)}
/* month */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{text-align:center;font-size:11px;color:var(--ink-3);padding-bottom:2px}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;cursor:pointer;padding:2px}
.cell .d{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cell .m{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff;font-variant-numeric:tabular-nums}
.cell.blank{border:0;background:none;cursor:default}
.cell.today{border-color:var(--teal);border-width:2px}
.cell .af{width:6px;height:6px;border-radius:50%;background:var(--sage);opacity:.6}
.cell .none{width:6px;height:6px;border-radius:50%;background:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:12px;align-items:center}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px;font-style:normal}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.stat{border:1px solid var(--line);border-radius:11px;padding:11px 12px}
.stat b{display:block;font-family:ui-serif,Georgia,serif;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--ink-2)}
.weeks{display:flex;align-items:flex-end;gap:6px;height:66px;margin:12px 0 4px}
.weeks div{flex:1;background:var(--amber);border-radius:5px 5px 2px 2px;min-height:3px;opacity:.85}
.weeks div:last-child{opacity:1}
/* bottom action */
.fab{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 62%,rgba(237,241,242,0));z-index:20}
.fab .inner{max-width:540px;margin:0 auto}
.primary{width:100%;border:0;background:var(--teal);color:#fff;font:inherit;font-size:17px;font-weight:600;padding:16px;border-radius:14px;cursor:pointer;box-shadow:0 6px 20px -8px rgba(31,95,99,.7)}
.primary:active{background:#1A5155}
.ghost{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:13px;border-radius:12px;cursor:pointer;margin-top:8px}
.danger{color:var(--rust);border-color:#E7CFCA}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(23,38,46,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-radius:20px 20px 0 0;z-index:31;transform:translateY(101%);transition:transform .26s cubic-bezier(.2,.8,.25,1);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 4px}
.sheethead{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px;position:sticky;top:0;background:var(--paper);z-index:2}
.sheethead h3{margin:0;font-size:17px;font-weight:650}
.sheethead button{border:0;background:none;font:inherit;font-size:15px;color:var(--teal);cursor:pointer;padding:6px 0;font-weight:550}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pick{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:15px 14px;text-align:left;font:inherit;cursor:pointer}
.pick:active{background:#F7FAFB;transform:scale(.985)}
.pick b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
.pick span{font-size:12px;color:var(--ink-3)}
.pick.wide{grid-column:1/-1}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;font-weight:550}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink)}
.field textarea{min-height:70px;resize:vertical}
.row2{display:flex;gap:9px}.row2>*{flex:1}
.chiprow{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 13px;font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(152px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:14px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:calc(100% - 36px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{background:none;border:0;color:#8FD3C9;font:inherit;font-weight:650;cursor:pointer;padding:2px}
.note{font-size:13px;color:var(--ink-2);line-height:1.5}
.note a{color:var(--teal)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--amber-soft);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 14px;font-size:13.5px;color:var(--ink)}
.banner button{flex:none;border:0;background:var(--ink);color:#fff;font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer}
.helplink{border:0;background:none;color:var(--rust);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:8px 2px}
/* streak + chips */
.streakcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.streakcard .num{font-size:34px;font-weight:600;line-height:1}
.streakcard .lbl{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.streakcard .setlink{border:0;background:none;color:var(--teal);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 0 0}
.chipstrip{display:flex;gap:7px;overflow-x:auto;padding:14px 0 2px;margin:2px -2px 0}
.mchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:52px}
.mchip .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;border:2px solid var(--line)}
.mchip.earned .dot{border-color:transparent;color:#fff}
.mchip .t{font-size:10px;color:var(--ink-3);text-align:center;line-height:1.2}
.mchip.earned .t{color:var(--ink-2);font-weight:600}
.secondary{width:100%;border:1px solid var(--line);background:none;color:var(--ink-2);font:inherit;font-size:14px;padding:11px;border-radius:12px;cursor:pointer;margin-top:8px}
pre.out{white-space:pre-wrap;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;max-height:230px;overflow:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brandrow">
      <div class="brand">Drink Log</div>
      <div style="display:flex;align-items:center;gap:2px">
        <button class="helplink" id="btnCrisis">Need help now?</button>
        <button class="iconbtn" id="btnSettings" aria-label="Settings and export">⋯</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-view="day" aria-selected="false">Today</button>
      <button role="tab" data-view="week" aria-selected="true">Week</button>
      <button role="tab" data-view="month" aria-selected="false">Month</button>
    </div>
  </header>
  <div id="streakCard"></div>
  <div class="banner" id="backupBanner" hidden></div>
  <main id="view"></main>
</div>

<div class="fab"><div class="inner">
  <button class="primary" id="btnLog">Log a drink</button>
  <button class="secondary" id="btnCraving">Log a craving</button>
</div></div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grip"></div>
  <div class="sheethead"><h3 id="sheetTitle">Log</h3><button id="sheetClose">Close</button></div>
  <div id="sheetBody"></div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct">Undo</button></div>

<script>
/* ---------- storage (works as a downloaded file, hosted page, or inside Claude) ---------- */
const KEY='drinklog.v1';
const Store={
  async get(){
    try{ if(window.storage){const r=await window.storage.get(KEY); return r? r.value:null;} }catch(e){}
    try{ return localStorage.getItem(KEY); }catch(e){ return null; }
  },
  async set(v){
    try{ if(window.storage){ await window.storage.set(KEY,v); return; } }catch(e){}
    try{ localStorage.setItem(KEY,v); }catch(e){}
  }
};
let DB={entries:[],settings:{weeklyLimit:14,trackOther:false,weekStart:0,lastBackupAt:null,sobrietyStartDate:null}};
let view='week', focusDate=null, monthCursor=null, pendingUndo=null, toastTimer=null;

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c);};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const startOfWeek=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()-DB.settings.weekStart+7)%7));return x;};
const fmtTime=ts=>new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const round1=n=>Math.round(n*10)/10;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayName=(d,long)=>d.toLocaleDateString([], long?{weekday:'long',month:'short',day:'numeric'}:{weekday:'short'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const toLocalInput=ts=>{const d=new Date(ts);return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);};
const nowLocalInput=()=>toLocalInput(Date.now());

function entriesFor(key){ return DB.entries.filter(e=>dkey(new Date(e.ts))===key).sort((a,b)=>a.ts-b.ts); }
function sdFor(key){ return round1(entriesFor(key).filter(e=>e.kind==='alcohol').reduce((s,e)=>s+(e.sd||0),0)); }
function drankOn(key){ return entriesFor(key).some(e=>e.kind==='alcohol'); }
function hasLog(key){ return DB.entries.some(e=>dkey(new Date(e.ts))===key); }

/* standard drink = 0.6 fl oz pure alcohol (US) */
const PRESETS=[
  {id:'beer',   name:'Beer',            desc:'12 oz · 5%',    sd:1.0},
  {id:'craft',  name:'Craft beer / IPA',desc:'16 oz · 7%',    sd:1.9},
  {id:'wine',   name:'Wine',            desc:'5 oz · 12%',    sd:1.0},
  {id:'shot',   name:'Shot',            desc:'1.5 oz · 40%',  sd:1.0},
  {id:'mixed',  name:'Mixed drink',     desc:'~1.5 shots',    sd:1.5},
  {id:'seltzer',name:'Hard seltzer',    desc:'12 oz · 5%',    sd:1.0},
  {id:'glasswine',name:'Big pour of wine',desc:'8 oz · 12%',  sd:1.6},
  {id:'double', name:'Double / strong pour',desc:'3 oz · 40%',sd:2.0}
];
const OTHER=[
  {id:'cannabis',name:'Cannabis',unit:'session'},
  {id:'nicotine',name:'Nicotine',unit:'use'},
  {id:'other',name:'Something else',unit:'use'}
];

async function save(){ await Store.set(JSON.stringify(DB)); }
async function load(){
  const raw=await Store.get();
  if(raw){ try{ const p=JSON.parse(raw); DB.entries=p.entries||[]; DB.settings=Object.assign(DB.settings,p.settings||{}); }catch(e){} }
}

/* ---------- streak + milestones ---------- */
/* Chip colors follow the common AA tradition (varies by group): white for
 * 24 hours, red for 30 days, gold for 60, green for 90, blue for 6 months,
 * a darker red for 9 months, purple for a year and beyond. */
const MILESTONES=[
  {days:1,   label:'24 hours', color:'#FFFFFF', text:'#17262E', border:true},
  {days:30,  label:'30 days',  color:'#C0392B', text:'#FFFFFF'},
  {days:60,  label:'60 days',  color:'#C99A2E', text:'#17262E'},
  {days:90,  label:'90 days',  color:'#3F8F5C', text:'#FFFFFF'},
  {days:182, label:'6 months', color:'#2E6FA7', text:'#FFFFFF'},
  {days:274, label:'9 months', color:'#7A2E2E', text:'#FFFFFF'},
  {days:365, label:'1 year',   color:'#6A3FA0', text:'#FFFFFF'},
];

function mostRecentDrinkKey(){
  const keys=DB.entries.filter(e=>e.kind==='alcohol').map(e=>dkey(new Date(e.ts)));
  return keys.length? keys.sort().slice(-1)[0] : null;
}
function streakStartKey(){
  const lastDrink=mostRecentDrinkKey();
  const manual=DB.settings.sobrietyStartDate;
  if(manual && (!lastDrink || manual>lastDrink)) return manual;
  if(lastDrink) return dkey(addDays(fromKey(lastDrink),1));
  return manual;
}
function currentStreakDays(){
  const startKey=streakStartKey();
  if(!startKey) return null;
  const diff=Math.floor((today()-fromKey(startKey))/86400000)+1;
  return Math.max(0, diff);
}
function renderStreakCard(){
  const el=document.getElementById('streakCard');
  const streak=currentStreakDays();
  const earned=MILESTONES.filter(m=>streak!==null && streak>=m.days);
  const next=MILESTONES.find(m=>streak===null || streak<m.days);
  const chips=MILESTONES.map(m=>{
    const isEarned=streak!==null && streak>=m.days;
    const style=isEarned? `background:${m.color};color:${m.text};${m.border?'border-color:var(--line)':''}` : '';
    return `<div class="mchip ${isEarned?'earned':''}" title="${m.label}">
      <div class="dot" style="${style}">${isEarned?'✓':''}</div>
      <div class="t">${m.label}</div>
    </div>`;
  }).join('');
  el.innerHTML = `<section class="streakcard">
    ${streak===null
      ? `<div class="lbl">No sobriety start date set yet</div><button class="setlink" id="setStreakBtn">Set your start date</button>`
      : `<div class="num">${streak}</div><div class="lbl">${streak===1?'day':'days'} alcohol-free${next? ` · ${next.days-streak} to go for ${next.label}` : ' · every milestone earned'}</div>`}
    <div class="chipstrip">${chips}</div>
  </section>`;
  const setBtn=document.getElementById('setStreakBtn');
  if(setBtn) setBtn.onclick=openStreakSettings;
}
function openStreakSettings(){
  openSheet('Sobriety start date', `
    <p class="note">This sets when your current streak began. It updates automatically the day after any drink you log — only set it by hand if you're starting fresh in the app, or resetting after a slip.</p>
    <div class="field"><label for="ssd">Start date</label><input id="ssd" type="date" value="${DB.settings.sobrietyStartDate||dkey(today())}"></div>
    <button class="primary" id="ssdSave">Save</button>
  `, ()=>{
    document.getElementById('ssdSave').onclick=async()=>{
      DB.settings.sobrietyStartDate=document.getElementById('ssd').value || null;
      await save(); closeSheet(); render();
    };
  });
}

/* ---------- crisis resources ---------- */
function openCrisis(){
  openSheet('Need help now?', `
    <p class="note">This app is a support tool, not a substitute for professional care. If you're in crisis or thinking about harming yourself, please reach out right now — these are free, confidential, and available anytime.</p>
    <a class="pick wide" style="display:block;margin-bottom:9px;text-decoration:none" href="tel:988"><b>988 Suicide &amp; Crisis Lifeline</b><span>Call or text 988 · 24/7</span></a>
    <a class="pick wide" style="display:block;text-decoration:none" href="tel:18006624357"><b>SAMHSA National Helpline</b><span>1-800-662-4357 · free, confidential, 24/7</span></a>
  `);
}

/* ---------- craving journal ---------- */
const CRAVING_LEVELS=[
  {id:'mild', label:'Mild', desc:'Noticed it, staying steady'},
  {id:'moderate', label:'Moderate', desc:'Distracting, need a plan'},
  {id:'intense', label:'Intense', desc:'Hard to think past it'},
];
function openCraving(){
  const contexts=['Home alone','With friends','Out','With family','Work','After a hard day'];
  let intensity='moderate', ctx='';
  openSheet('Log a craving', `
    <div class="field"><label>How strong is it?</label><div class="chiprow" id="cravLevel">
      ${CRAVING_LEVELS.map(l=>`<button class="chip" aria-pressed="${l.id===intensity}" data-l="${l.id}">${l.label}</button>`).join('')}
    </div></div>
    <div class="field"><label>What's going on</label><div class="chiprow" id="cravCtx">
      ${contexts.map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join('')}
    </div></div>
    <div class="field"><label for="cravNote">Note (optional)</label><textarea id="cravNote" placeholder="What triggered it, what's helping right now."></textarea></div>
    <button class="primary" id="cravSave">Save — no drink logged</button>
  `, ()=>{
    document.querySelectorAll('#cravLevel .chip').forEach(b=>b.onclick=()=>{
      intensity=b.dataset.l;
      document.querySelectorAll('#cravLevel .chip').forEach(x=>x.setAttribute('aria-pressed', x.dataset.l===intensity));
    });
    document.querySelectorAll('#cravCtx .chip').forEach(b=>b.onclick=()=>{
      ctx = ctx===b.dataset.c? '' : b.dataset.c;
      document.querySelectorAll('#cravCtx .chip').forEach(x=>x.setAttribute('aria-pressed', x.dataset.c===ctx));
    });
    document.getElementById('cravSave').onclick=()=>{
      addEntry({kind:'craving', label:'Craving', intensity, context:ctx, note:document.getElementById('cravNote').value.trim(), ts:Date.now()});
      closeSheet();
    };
  });
}

/* ---------- rendering ---------- */
const BACKUP_REMINDER_DAYS=21;
function updateBackupBanner(){
  const el=document.getElementById('backupBanner');
  if(!DB.entries.length){ el.hidden=true; return; }
  const last=DB.settings.lastBackupAt;
  const days=last? Math.floor((Date.now()-last)/86400000) : null;
  const stale = last===null || days>=BACKUP_REMINDER_DAYS;
  if(!stale){ el.hidden=true; return; }
  el.hidden=false;
  el.innerHTML=`<span>${last? `Last backed up ${days} day${days===1?'':'s'} ago.` : "You haven't saved a backup yet."} A cleared browser can erase everything.</span><button id="bannerBackupBtn">Back up now</button>`;
  document.getElementById('bannerBackupBtn').onclick=backup;
}

function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.view===view));
  const el=document.getElementById('view');
  el.innerHTML = view==='day'? renderDay() : view==='week'? renderWeek() : renderMonth();
  bindView();
  updateBackupBanner();
  renderStreakCard();
}

function renderDay(){
  const d = focusDate || today();
  const key = dkey(d), list = entriesFor(key), sd = sdFor(key);
  const isToday = key===dkey(today());
  const hours = Array(24).fill(0);
  list.filter(e=>e.kind==='alcohol').forEach(e=>{ hours[new Date(e.ts).getHours()] += e.sd||0; });
  const max = Math.max(1, ...hours);
  const first = list.filter(e=>e.kind==='alcohol')[0];
  const last  = list.filter(e=>e.kind==='alcohol').slice(-1)[0];
  let lede;
  if(sd>0){
    lede = `<p class="lede"><b>${sd}</b> standard ${sd===1?'drink':'drinks'} ${isToday?'today':'that day'}</p>
            <p class="sub">${first? `First at ${fmtTime(first.ts)}${last&&last!==first?`, last at ${fmtTime(last.ts)}`:''}`:''}</p>`;
  } else {
    lede = `<p class="lede">No drinks logged ${isToday?'today':'that day'}</p>
            <p class="sub">${isToday?'You can still log something from earlier.':'An alcohol-free day.'}</p>`;
  }
  const nav = `<div class="dayhead" style="padding-bottom:12px">
      <button class="chip" data-shift="-1">‹ Previous</button>
      <b>${isToday?'Today':dayName(d,true)}</b>
      <button class="chip" data-shift="1" ${isToday?'disabled style="opacity:.35"':''}>Next ›</button>
    </div>`;
  return `<section class="card">${nav}${lede}
    <div class="hours">${hours.map(h=>`<div class="hr ${h>0?'on':''}" style="height:${h>0?Math.max(12,(h/max)*100):3}%" title="${h?round1(h)+' SD':''}"></div>`).join('')}</div>
    <div class="hourax"><span>12a</span><span>6a</span><span>noon</span><span>6p</span><span>11p</span></div>
  </section>
  ${list.length? `<h2>Logged</h2>${list.map(entryRow).join('')}` :
    `<div class="empty"><b>Nothing logged yet</b>Tap “Log a drink” — it takes one tap.</div>`}`;
}

function entryRow(e){
  const amt = e.kind==='alcohol' ? `<span class="sd">${round1(e.sd)}</span>`
    : e.kind==='craving' ? `<span class="sd other">${(CRAVING_LEVELS.find(l=>l.id===e.intensity)||{}).label||''}</span>`
    : `<span class="sd other">${e.qty||1} ${e.unit||''}</span>`;
  const label = e.kind==='craving' ? 'Craving' : e.label;
  const meta=[e.context,e.note].filter(Boolean).join(' · ');
  return `<button class="entry" data-id="${e.id}">
    <span class="time">${fmtTime(e.ts)}</span>
    <span class="name">${esc(label)}${meta?`<small>${esc(meta)}</small>`:''}</span>${amt}</button>`;
}

function renderWeek(){
  const start = startOfWeek(focusDate||today());
  const days = Array.from({length:7},(_,i)=>addDays(start,i));
  const vals = days.map(d=>sdFor(dkey(d)));
  const total = round1(vals.reduce((a,b)=>a+b,0));
  const drinkingDays = days.filter(d=>drankOn(dkey(d))).length;
  const tkey=dkey(today());
  const past = days.filter(d=>dkey(d)<=tkey);
  const afDays = past.filter(d=>!drankOn(dkey(d))).length;
  const prev = days.map(d=>sdFor(dkey(addDays(d,-7)))).reduce((a,b)=>a+b,0);
  const lim = DB.settings.weeklyLimit;
  const max = Math.max(...vals, lim? lim/3:0, 3);
  const over = lim && total>lim;
  const isThisWeek = dkey(start)===dkey(startOfWeek(today()));

  let compare='';
  if(prev>0||total>0){
    const diff=round1(total-prev);
    compare = diff===0? 'Same as the week before.' :
      diff>0? `<span class="up">${diff} more</span> than the week before.` :
              `<span class="down">${Math.abs(diff)} fewer</span> than the week before.`;
  }
  const limitTop = lim? (1 - Math.min(1,(lim/7)/max))*100 : null;

  const bars = days.map((d,i)=>{
    const v=vals[i], k=dkey(d), fut = k>tkey;
    const h = v>0? Math.max(6,(v/max)*100) : 0;
    const dayOver = lim && v > lim/7*1.8;
    return `<button class="col" data-date="${k}" aria-label="${dayName(d,true)}: ${v} standard drinks">
      <span class="val">${v>0?v:''}</span>
      ${v>0? `<span class="bar ${dayOver?'over':''}" style="height:${h}%"></span>`
           : `<span class="dot ${fut?'future':''}"></span>`}
    </button>`;
  }).join('');

  return `<section class="card">
    <p class="lede"><b>${total}</b> standard ${total===1?'drink':'drinks'} ${isThisWeek?'this week':'that week'}</p>
    <p class="sub">${drinkingDays? `Across ${drinkingDays} ${drinkingDays===1?'day':'days'}. ${afDays} alcohol-free so far.` : 'Nothing logged yet this week.'} ${compare}</p>
    <div class="strip">
      ${limitTop!==null? `<div class="limitline" style="top:${limitTop}%"><i>daily pace</i></div>`:''}
      ${bars}
    </div>
    <div class="axis">${days.map(d=>`<span class="${dkey(d)===tkey?'today':''}">${dayName(d)}</span>`).join('')}</div>
    ${lim? `<p class="sub" style="margin-top:12px">${over? `Over your ${lim}-drink weekly marker by ${round1(total-lim)}.` : `${round1(lim-total)} left before your ${lim}-drink weekly marker.`}</p>`:''}
    <div class="dayhead" style="padding:14px 0 0">
      <button class="chip" data-wshift="-1">‹ Previous week</button>
      <button class="chip" data-wshift="1" ${isThisWeek?'disabled style="opacity:.35"':''}>Next ›</button>
    </div>
  </section>
  ${weekList(days)}`;
}

function weekList(days){
  const withEntries = days.filter(d=>entriesFor(dkey(d)).length).reverse();
  if(!withEntries.length) return `<div class="empty"><b>An empty week so far</b>Every log makes the picture you bring to your next session more accurate.</div>`;
  return `<h2>Logged this week</h2>` + withEntries.map(d=>{
    const k=dkey(d), sd=sdFor(k);
    return `<div class="day"><div class="dayhead"><b>${dkey(d)===dkey(today())?'Today':dayName(d,true)}</b><span>${sd>0?sd+' SD':'no alcohol'}</span></div>
      ${entriesFor(k).map(entryRow).join('')}</div>`;
  }).join('');
}

function renderMonth(){
  const cur = monthCursor || new Date(today().getFullYear(), today().getMonth(), 1);
  const y=cur.getFullYear(), m=cur.getMonth();
  const first=new Date(y,m,1), dim=new Date(y,m+1,0).getDate();
  const lead=(first.getDay()-DB.settings.weekStart+7)%7;
  const tkey=dkey(today());
  let cells='';
  for(let i=0;i<lead;i++) cells+=`<div class="cell blank"></div>`;
  let total=0, drinkDays=0, afDays=0, heavy={v:0,k:null}, logged=0;
  for(let d=1;d<=dim;d++){
    const date=new Date(y,m,d), k=dkey(date), v=sdFor(k), fut=k>tkey;
    if(!fut){ total+=v; if(v>0){drinkDays++; if(v>heavy.v)heavy={v,k};} else afDays++; if(hasLog(k))logged++; }
    const size = v>0? Math.min(30, 15+v*2.4) : 0;
    const col = v>=5? 'var(--rust)' : v>0? 'var(--amber)' : '';
    const mark = v>0 ? `<span class="m" style="width:${size}px;height:${size}px;background:${col}">${round1(v)}</span>`
                     : `<span class="${fut?'none':'af'}"></span>`;
    cells+=`<button class="cell ${k===tkey?'today':''}" data-date="${k}" aria-label="${d}: ${v} standard drinks"><span class="d">${d}</span>${mark}</button>`;
  }
  const dows=['S','M','T','W','T','F','S'];
  const order=Array.from({length:7},(_,i)=>dows[(i+DB.settings.weekStart)%7]);
  const days = Math.min(dim, (y===today().getFullYear()&&m===today().getMonth())? today().getDate() : dim);
  const avg = days? round1(total/days) : 0;
  const isThisMonth = y===today().getFullYear() && m===today().getMonth();

  // last 8 weeks
  const ws=startOfWeek(today());
  const weeks=Array.from({length:8},(_,i)=>{
    const s=addDays(ws,-7*(7-i));
    return round1(Array.from({length:7},(_,j)=>sdFor(dkey(addDays(s,j)))).reduce((a,b)=>a+b,0));
  });
  const wmax=Math.max(1,...weeks);

  return `<section class="card">
    <div class="dayhead" style="padding-bottom:14px">
      <button class="chip" data-mshift="-1">‹</button>
      <b>${cur.toLocaleDateString([], {month:'long', year:'numeric'})}</b>
      <button class="chip" data-mshift="1" ${isThisMonth?'disabled style="opacity:.35"':''}>›</button>
    </div>
    <div class="cal">${order.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
    <div class="legend">
      <span><i style="background:var(--amber)"></i>drinking day</span>
      <span><i style="background:var(--rust)"></i>5+ drinks</span>
      <span><i style="background:var(--sage);opacity:.6"></i>alcohol-free</span>
    </div>
  </section>
  <section class="card">
    <div class="statgrid">
      <div class="stat"><b>${round1(total)}</b><span>standard drinks</span></div>
      <div class="stat"><b>${avg}</b><span>average per day</span></div>
      <div class="stat"><b>${afDays}</b><span>alcohol-free days</span></div>
      <div class="stat"><b>${heavy.k? round1(heavy.v):'—'}</b><span>${heavy.k? 'heaviest day, '+fromKey(heavy.k).toLocaleDateString([], {month:'short',day:'numeric'}) : 'heaviest day'}</span></div>
    </div>
  </section>
  <section class="card">
    <p class="lede" style="font-size:16px;margin-bottom:2px">Last eight weeks</p>
    <p class="sub">Weekly totals, oldest to newest.</p>
    <div class="weeks">${weeks.map(w=>`<div style="height:${Math.max(4,(w/wmax)*100)}%" title="${w} SD"></div>`).join('')}</div>
    <div class="hourax"><span>8 wks ago</span><span>this week</span></div>
  </section>`;
}

function bindView(){
  document.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>{ focusDate=addDays(focusDate||today(), +b.dataset.shift); render(); });
  document.querySelectorAll('[data-wshift]').forEach(b=>b.onclick=()=>{ focusDate=addDays(startOfWeek(focusDate||today()), 7*+b.dataset.wshift); render(); });
  document.querySelectorAll('[data-mshift]').forEach(b=>b.onclick=()=>{
    const c=monthCursor||new Date(today().getFullYear(),today().getMonth(),1);
    monthCursor=new Date(c.getFullYear(), c.getMonth()+ +b.dataset.mshift, 1); render();
  });
  document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{ focusDate=fromKey(b.dataset.date); view='day'; render(); });
  document.querySelectorAll('.entry').forEach(b=>b.onclick=()=>openEntry(b.dataset.id));
}

function openEntry(id){
  const e=DB.entries.find(x=>x.id===id); if(!e) return;
  const local=toLocalInput(e.ts);
  const contexts=['Home alone','With friends','Out','With family','Work','After a hard day'];
  openSheet('Edit entry', `
    <div class="field"><label for="el">What it was</label><input id="el" value="${esc(e.label)}"></div>
    ${e.kind==='alcohol'
      ? `<div class="field"><label for="esd">Standard drinks</label><input id="esd" type="number" inputmode="decimal" step="0.1" value="${round1(e.sd)}"></div>`
      : e.kind==='craving'
      ? `<div class="field"><label>How strong was it?</label><div class="chiprow" id="ecrav">${CRAVING_LEVELS.map(l=>`<button class="chip" aria-pressed="${l.id===e.intensity}" data-l="${l.id}">${l.label}</button>`).join('')}</div></div>`
      : `<div class="field"><label for="eq">How many</label><input id="eq" type="number" inputmode="decimal" step="0.5" value="${e.qty||1}"></div>`}
    <div class="field"><label for="ets">When</label><input id="ets" type="datetime-local" value="${local}"></div>
    <div class="field"><label>Context</label><div class="chiprow" id="ectx">
      ${contexts.map(c=>`<button class="chip" aria-pressed="${e.context===c}" data-c="${c}">${c}</button>`).join('')}
    </div></div>
    <div class="field"><label for="enote">Note</label><textarea id="enote">${esc(e.note)}</textarea></div>
    <button class="primary" id="esave">Save changes</button>
    <button class="ghost danger" id="edel">Delete this entry</button>
  `, ()=>{
    let ctx=e.context||'';
    let intensity=e.intensity;
    document.querySelectorAll('#ectx .chip').forEach(b=>b.onclick=()=>{
      ctx = ctx===b.dataset.c? '' : b.dataset.c;
      document.querySelectorAll('#ectx .chip').forEach(x=>x.setAttribute('aria-pressed', x.dataset.c===ctx));
    });
    document.querySelectorAll('#ecrav .chip').forEach(b=>b.onclick=()=>{
      intensity=b.dataset.l;
      document.querySelectorAll('#ecrav .chip').forEach(x=>x.setAttribute('aria-pressed', x.dataset.l===intensity));
    });
    document.getElementById('esave').onclick=async()=>{
      e.label=document.getElementById('el').value.trim()||e.label;
      if(e.kind==='alcohol') e.sd=parseFloat(document.getElementById('esd').value)||0;
      else if(e.kind==='craving') e.intensity=intensity;
      else e.qty=parseFloat(document.getElementById('eq').value)||1;
      e.ts=new Date(document.getElementById('ets').value).getTime()||e.ts;
      e.context=ctx; e.note=document.getElementById('enote').value.trim();
      await save(); closeSheet(); render(); toast('Entry updated');
    };
    document.getElementById('edel').onclick=async()=>{
      DB.entries=DB.entries.filter(x=>x.id!==id);
      await save(); closeSheet(); render(); toast('Entry deleted');
    };
  });
}

function summaryText(weeks){
  const end=today(), start=addDays(startOfWeek(end), -7*(weeks-1));
  const lines=[];
  lines.push(`Drink log — ${start.toLocaleDateString()} to ${end.toLocaleDateString()}`);
  lines.push('');
  let grand=0, drinkDays=0, afDays=0, heaviest={v:0,k:null};
  for(let w=0; w<weeks; w++){
    const ws=addDays(start,7*w);
    const days=Array.from({length:7},(_,i)=>addDays(ws,i)).filter(d=>dkey(d)<=dkey(end));
    if(!days.length) continue;
    const vals=days.map(d=>sdFor(dkey(d)));
    const tot=round1(vals.reduce((a,b)=>a+b,0));
    const dd=days.filter(d=>drankOn(dkey(d))).length;
    grand+=tot; drinkDays+=dd; afDays+=days.length-dd;
    days.forEach((d,i)=>{ if(vals[i]>heaviest.v) heaviest={v:vals[i],k:dkey(d)}; });
    lines.push(`Week of ${ws.toLocaleDateString()}: ${tot} standard drinks over ${dd} drinking day${dd===1?'':'s'} (${days.length-dd} alcohol-free)`);
    lines.push('  ' + days.map((d,i)=>`${dayName(d)} ${vals[i]||0}`).join('  '));
  }
  lines.push('');
  lines.push(`Total: ${round1(grand)} standard drinks · ${drinkDays} drinking days · ${afDays} alcohol-free days`);
  if(heaviest.k) lines.push(`Heaviest day: ${fromKey(heaviest.k).toLocaleDateString()} — ${round1(heaviest.v)} standard drinks`);
  const notes=DB.entries.filter(e=>e.ts>=start.getTime() && (e.note||e.context)).sort((a,b)=>a.ts-b.ts);
  if(notes.length){
    lines.push(''); lines.push('Notes:');
    notes.forEach(e=>lines.push(`  ${new Date(e.ts).toLocaleDateString()} ${fmtTime(e.ts)} — ${e.label}${e.context?` (${e.context})`:''}${e.note?`: ${e.note}`:''}`));
  }
  lines.push(''); lines.push('One standard drink = 0.6 fl oz pure alcohol (12 oz beer at 5%, 5 oz wine at 12%, 1.5 oz spirits at 40%).');
  return lines.join('\n');
}

function downloadCSV(){
  const rows=[['date','time','kind','what','standard_drinks','quantity','context','note']];
  DB.entries.slice().sort((a,b)=>a.ts-b.ts).forEach(e=>{
    const d=new Date(e.ts);
    rows.push([dkey(d), fmtTime(e.ts), e.kind, e.label, e.kind==='alcohol'?round1(e.sd):'', e.qty||'', e.context||'', e.note||'']);
  });
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  download('drink-log.csv', csv, 'text/csv');
}
async function backup(){
  download(`drink-log-backup-${dkey(today())}.json`, JSON.stringify(DB,null,2), 'application/json');
  DB.settings.lastBackupAt=Date.now();
  await save();
  updateBackupBanner();
}
function restore(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const p=JSON.parse(r.result);
      if(!p.entries) throw 0;
      const have=new Set(DB.entries.map(e=>e.id));
      const added=p.entries.filter(e=>!have.has(e.id));
      DB.entries=DB.entries.concat(added);
      DB.settings=Object.assign(DB.settings,p.settings||{});
      await save(); closeSheet(); render(); toast(`Restored ${added.length} entries`);
    }catch(e){ toast("That file isn't a Drink Log backup"); }
  };
  r.readAsText(f);
}
function download(name, text, type){
  const b=new Blob([text],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},400);
}

/* ---------- wire up ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ view=b.dataset.view; if(view!=='day') focusDate=null; render(); });
document.getElementById('btnLog').onclick=openLog;
document.getElementById('btnCraving').onclick=openCraving;
document.getElementById('btnCrisis').onclick=openCrisis;
document.getElementById('btnSettings').onclick=openSettings;

(async()=>{
  await load(); render();
  // deep link: ?a=log opens straight to logging (use this for a Shortcuts button)
  const q=new URLSearchParams(location.search);
  if(q.get('a')==='log') setTimeout(openLog,180);
})();
</script>
